<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

<!-- Favicon — same bolt icon as the navbar logo -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2316a34a'%3E%3Cpath d='M13 2L5 14h6l-1 8 9-13h-6l1-7z'/%3E%3C/svg%3E" />

<!-- Tailwind css link in -->
  <script src="https://cdn.tailwindcss.com"></script>

<!-- Dark Mode change  -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#22c55e",
          },
        },
      },
    };
  </script>

<!-- Smooth dark/light mode transition — applies globally so every element
     fades its colors together, instead of only the elements that happen
     to have their own transition-all class. Scoped to color/shadow
     properties only, so it never interferes with layout, transform, or
     opacity-based scroll-reveal animations elsewhere on the site. -->
  <style>
    html.theme-transition,
    html.theme-transition *,
    html.theme-transition *::before,
    html.theme-transition *::after {
      transition-property: background-color, border-color, color, fill, stroke, box-shadow !important;
      transition-timing-function: ease !important;
      transition-duration: 400ms !important;
    }
  </style>

  <title>Voltix</title>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
